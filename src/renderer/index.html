<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>MeowsConvert</title>
  <link rel="stylesheet" href="../../node_modules/flag-icons/css/flag-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar"><img class="titlebar-icon" src="../../assets/icon-small.png" alt="" /><span>MeowsConvert</span></div>

  <!-- Конвертер -->
  <section id="view-main" class="view">
    <header class="top">
      <div class="top-text">
        <div class="app-title">MeowsConvert</div>
        <div id="status" class="status">…</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btn-refresh" title="Обновить курсы">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7.5 6.5 12 11V7.5a5.5 5.5 0 1 1-5.5 5.5H4a8 8 0 1 0 8-8z"/></svg>
        </button>
        <button class="icon-btn" id="btn-widget" title="Виджет на рабочем столе">
          <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="btn-source" title="Источник курсов">
          <svg viewBox="0 0 24 24"><path d="M12 2 2 7v2h20V7L12 2zM4 11v7h3v-7H4zm6.5 0v7h3v-7h-3zM17 11v7h3v-7h-3zM2 20v2h20v-2H2z"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Настройки">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54a7.3 7.3 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
        </button>
      </div>
    </header>

    <div id="rows" class="rows"></div>

    <div class="keypad" id="keypad">
      <button class="key fn" data-key="C">C</button>
      <button class="key fn" data-key="back" title="Стереть">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <button class="key fn" data-key="%">%</button>
      <button class="key op" data-key="÷">÷</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key op" data-key="×">×</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key op" data-key="−">−</button>
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key op" data-key="+">+</button>
      <button class="key wide" data-key="0">0</button>
      <button class="key" data-key=",">,</button>
      <button class="key op" data-key="=">=</button>
    </div>
  </section>

  <!-- Выбор валют -->
  <section id="view-picker" class="view page" hidden>
    <header class="page-head">
      <button class="back" data-back>
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <div>
        <div class="page-title" id="picker-title">Валюты</div>
        <div class="page-sub" id="picker-sub"></div>
      </div>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <input id="picker-search" type="text" placeholder="Поиск: код, название…" autocomplete="off" spellcheck="false" />
    </div>
    <div class="page-body" id="picker-body"></div>
  </section>

  <!-- Источник курсов -->
  <section id="view-source" class="view page" hidden>
    <header class="page-head">
      <button class="back" data-back>
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <div class="page-title">Источник курсов</div>
    </header>
    <div class="page-body" id="source-body"></div>
  </section>

  <!-- Настройки -->
  <section id="view-settings" class="view page" hidden>
    <header class="page-head">
      <button class="back" data-back>
        <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
      </button>
      <div class="page-title">Настройки</div>
    </header>
    <div class="page-body" id="settings-body"></div>
  </section>

  <script src="currencies.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
